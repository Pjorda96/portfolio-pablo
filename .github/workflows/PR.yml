name: Pull Request

on:
  pull_request:
    # labeled/unlabeled: adding `skip-version-check` re-runs the check.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - develop
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest

    env:
      # Required by src/env.ts in production builds; never contacted in CI.
      SITE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The version check compares against the base branch.
          fetch-depth: 0

      - name: Use node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          cache: 'npm'

      # Part of `verify` (not a job of its own) so it is enforced by the
      # required `verify` status check. Needs no dependencies, so it runs first.
      - name: Check the version bump
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-version-check') }}
        run: 'npm run version:check -- "origin/${{ github.base_ref }}"'

      - name: Install dependencies
        run: 'npm ci'

      - name: Typecheck
        run: 'npm run typescript'

      - name: Linter
        run: 'npm run lint'

      - name: Format
        run: 'npm run prettier:check'

      - name: Unit tests
        run: 'npm run test'

      - name: Build
        run: 'npm run build'

  # Performance budgets (docs/PERFORMANCE.md): Lighthouse CI on a production
  # build, mobile, 3 runs per URL, median. A job of its own and NOT a required
  # check: lab timings vary between runners, so it must never make `verify`
  # flaky. A red result is a regression to look at, with the reports attached.
  lighthouse:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest

    env:
      # Required by src/env.ts in production builds; never contacted in CI.
      SITE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Build
        run: 'npm run build'

      # Starts `next start -p 3400` itself and asserts lighthouserc.json.
      - name: Lighthouse CI
        run: 'npm run lhci'

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
