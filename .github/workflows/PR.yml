name: Pull Request

on:
  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest

    env:
      # Required by src/env.ts in production builds; never contacted in CI.
      SITE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Typecheck
        run: 'npm run typescript'

      - name: Linter
        run: 'npm run lint'

      - name: Format
        run: 'npm run prettier:check'

      - name: Unit tests
        run: 'npm run test'

      - name: Build
        run: 'npm run build'
